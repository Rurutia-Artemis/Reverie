<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Reverie</title>
  <desc id="desc">Reverie turns a small secondary display into a now-playing panel and an AI usage dashboard for Claude Code and Codex. The picture shows the three pages of the panel: music, quota rings, and cost.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0F14"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.18" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#FF6A3D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF6A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.86" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4C5E"/>
      <stop offset="0.55" stop-color="#F08A63"/>
      <stop offset="1" stop-color="#FBC89A"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5763"/>
      <stop offset="1" stop-color="#0B2A33"/>
    </linearGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A6E"/><stop offset="1" stop-color="#FF5A36"/></linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7AA2"/><stop offset="1" stop-color="#FF2D6F"/></linearGradient>
    <linearGradient id="ringC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC862"/><stop offset="1" stop-color="#FF9500"/></linearGradient>
    <linearGradient id="ringD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64D2FF"/><stop offset="1" stop-color="#2F7BFF"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5A36"/><stop offset="1" stop-color="#FF9A6E"/></linearGradient>
    <clipPath id="panel"><rect x="0" y="0" width="470" height="264" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#warm)"/>
  <rect width="1200" height="380" rx="28" fill="url(#cool)"/>

  <!-- title block -->
  <g id="title-block" transform="translate(64 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="0" font-size="18" font-weight="600" letter-spacing="3" fill="#9C9CA3">MACOS · MENU BAR · SECONDARY DISPLAY</text>
    <text x="-4" y="98" font-size="104" font-weight="800" letter-spacing="-3" fill="#F5F5F7">Reverie</text>
    <text x="0" y="152" font-size="30" font-weight="500" fill="#F5F5F7">A spare second screen becomes a music</text>
    <text x="0" y="192" font-size="30" font-weight="500" fill="#F5F5F7">panel and an AI usage dashboard.</text>
    <g transform="translate(0 232)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9C9CA3">
      <text x="0" y="0">Swift · macOS 14+ · Claude Code · Codex · MIT</text>
    </g>
    <!-- sunset motif from the app icon -->
    <g transform="translate(0 258)">
      <path d="M0 0 A18 18 0 0 1 36 0 Z" fill="#FFD9A8"/>
      <rect x="-6" y="2" width="48" height="4" rx="2" fill="#F08A63" opacity="0.9"/>
      <rect x="6" y="10" width="24" height="4" rx="2" fill="#F08A63" opacity="0.6"/>
      <rect x="12" y="18" width="12" height="4" rx="2" fill="#F08A63" opacity="0.35"/>
    </g>
  </g>

  <!-- proof: the 16:9 panel with its three pages -->
  <g id="project-proof" transform="translate(716 58) scale(0.9)">
    <rect x="0" y="0" width="470" height="264" rx="22" fill="#111216" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <g clip-path="url(#panel)">
      <!-- zone 1: music — cover, title lines, controls -->
      <g transform="translate(22 22)">
        <rect x="0" y="0" width="112" height="112" rx="14" fill="url(#sky)"/>
        <rect x="0" y="64" width="112" height="48" fill="url(#sea)"/>
        <circle cx="56" cy="62" r="18" fill="#FFF1D6"/>
        <rect x="0" y="0" width="112" height="112" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <rect x="0" y="128" width="112" height="14" rx="7" fill="#F5F5F7"/>
        <rect x="0" y="150" width="72" height="9" rx="4.5" fill="#9C9CA3"/>
        <rect x="0" y="174" width="112" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.14"/>
        <rect x="0" y="174" width="66" height="6" rx="3" fill="url(#bar)"/>
        <circle cx="34" cy="204" r="3" fill="#F5F5F7"/>
        <circle cx="56" cy="204" r="9" fill="#F5F5F7"/>
        <circle cx="78" cy="204" r="3" fill="#F5F5F7"/>
      </g>
      <!-- zone 2: cost — seven daily bars -->
      <g transform="translate(170 22)">
        <rect x="0" y="0" width="118" height="24" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
        <rect x="8" y="7" width="46" height="10" rx="5" fill="#F5F5F7"/>
        <rect x="64" y="7" width="26" height="10" rx="5" fill="#9C9CA3"/>
        <g transform="translate(0 60)">
          <rect x="0" y="100" width="12" height="46" rx="4" fill="#FF7A59" opacity="0.4"/>
          <rect x="18" y="74" width="12" height="72" rx="4" fill="#FF7A59" opacity="0.45"/>
          <rect x="36" y="90" width="12" height="56" rx="4" fill="#FF7A59" opacity="0.5"/>
          <rect x="54" y="52" width="12" height="94" rx="4" fill="#FF7A59" opacity="0.55"/>
          <rect x="72" y="80" width="12" height="66" rx="4" fill="#FF7A59" opacity="0.6"/>
          <rect x="90" y="30" width="12" height="116" rx="4" fill="#FF7A59" opacity="0.7"/>
          <rect x="108" y="0" width="12" height="146" rx="4" fill="#FF5A36"/>
        </g>
      </g>
      <!-- zone 3: quota — three Claude rings and one Codex ring -->
      <g transform="translate(372 96)">
        <circle r="56" fill="none" stroke="#FF5A36" stroke-opacity="0.16" stroke-width="12"/>
        <circle r="56" fill="none" stroke="url(#ringA)" stroke-width="12" stroke-linecap="round" stroke-dasharray="222 352" transform="rotate(-90)"/>
        <circle r="40" fill="none" stroke="#FF2D6F" stroke-opacity="0.16" stroke-width="12"/>
        <circle r="40" fill="none" stroke="url(#ringB)" stroke-width="12" stroke-linecap="round" stroke-dasharray="90 252" transform="rotate(-90)"/>
        <circle r="24" fill="none" stroke="#FF9500" stroke-opacity="0.16" stroke-width="12"/>
        <circle r="24" fill="none" stroke="url(#ringC)" stroke-width="12" stroke-linecap="round" stroke-dasharray="112 152" transform="rotate(-90)"/>
      </g>
      <g transform="translate(414 196)">
        <circle r="26" fill="none" stroke="#2F7BFF" stroke-opacity="0.16" stroke-width="10"/>
        <circle r="26" fill="none" stroke="url(#ringD)" stroke-width="10" stroke-linecap="round" stroke-dasharray="102 164" transform="rotate(-90)"/>
      </g>
      <!-- zone labels -->
      <g transform="translate(22 250)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2" fill="#9C9CA3">
        <text x="0" y="0">MUSIC</text>
        <text x="148" y="0">COST</text>
        <text x="288" y="0">QUOTA</text>
      </g>
    </g>
    <!-- 1280 × 720 caption -->
    <text x="470" y="292" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6B6B72">1280 × 720 canvas · scales to any display</text>
  </g>
</svg>
